name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Release workflow on the version PR (PRs opened by GITHUB_TOKEN don't trigger CI).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: [18, 19]
    name: check (React ${{ matrix.react }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
