name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Started by the Release workflow on the version PR (PRs opened by GITHUB_TOKEN don't trigger CI).
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        react: [18, 19]
    name: check (React ${{ matrix.react }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - if: matrix.react == 18
        run: npm install --no-save react@18 react-dom@18
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package
