name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit and tag
  pull-requests: write # open the "Version Packages" PR
  id-token: write # npm trusted publishing (OIDC): no NPM_TOKEN secret needed
  actions: write # start CI on the version PR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # With pending changesets: opens/updates the "Version Packages" PR.
      # After that PR is merged: builds and publishes to npm, then tags the release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version: npm run version
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Branch protection requires CI to pass on the version PR, but PRs opened by
      # GITHUB_TOKEN don't trigger workflows, so start CI on that branch explicitly.
      - if: steps.changesets.outputs.pullRequestNumber
        run: gh workflow run ci.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
